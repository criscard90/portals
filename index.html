<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals</title>
    
    <!-- PWA Configurazione -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="application-name" content="Portals">
    <meta name="apple-mobile-web-app-title" content="Portals">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Librerie Esterne: Three.js per 3D/GLSL e GSAP per fluidità organica -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Bordo nero superiore 10% per fullscreen */
        #fullscreen-top-border {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: #000;
            z-index: 100;
            pointer-events: none;
            transition: height 0.3s ease;
        }

        #fullscreen-top-border.active {
            height: 10vh;
        }

        /* Toast notifications */
        #tap-toast, #swipe-toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 0.5px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        #tap-toast {
            top: 130px;
        }

        #swipe-toast {
            top: 130px;
        }

        #tap-toast.show, #swipe-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* UI Selector Float */
        #ui-controls {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 16, 0.85);
            padding: 10px 16px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            transition: opacity 0.4s ease, transform 0.4s ease;
            min-width: 240px;
        }

        #ui-controls.hidden {
            opacity: 0;
            transform: translate(-50%, -30px);
            pointer-events: none;
        }

        .controls-main {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .controls-carousel-toggle-row {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .controls-carousel {
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
            padding-top: 6px;
        }

        .controls-carousel.active {
            display: flex;
        }

        .carousel-toggle {
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .carousel-option {
            color: #888;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: color 0.3s;
        }

        .carousel-option.active {
            color: #fff;
        }

        #duration-slider {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #duration-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        #duration-value {
            color: #fff;
            font-size: 11px;
            min-width: 24px;
            text-align: center;
        }

        .carousel-toggle input, .carousel-option input {
            accent-color: #4af;
            cursor: pointer;
        }

        select {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        select option {
            background: #0f0f15;
            color: #fff;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="fullscreen-top-border"></div>
    <div id="tap-toast">Tap to enter fullscreen</div>
    <div id="swipe-toast">← Swipe to switch portals →</div>

    <div id="ui-controls">
        <div class="controls-main">
            <select id="portal-select">
                <option value="nether">Nether</option>
                <option value="doctor">Spark</option>
                <option value="cosmic" selected>Vortex</option>
                <option value="lightning">Storm</option>
                <option value="wormhole">Hyperdrive</option>
                <option value="quantum">Quantum</option>
                <option value="smoke">Mist</option>
                <option value="water">Aqua</option>
                <option value="fire">Inferno</option>
                <option value="alien">Xenon</option>
                <option value="dragon">Dragon</option>
                <option value="paradise">Paradise</option>
                <option value="aurora">Aurora</option>
                <option value="glitch">Glitch</option>
            </select>
        </div>
        <div class="controls-carousel-toggle-row">
            <label class="carousel-toggle">
                <input type="checkbox" id="carousel-toggle"> Carousel
            </label>
        </div>
        <div class="controls-carousel">
            <label class="carousel-option" id="random-label">
                <input type="checkbox" id="random-toggle" disabled> Random
            </label>
            <label class="carousel-option">
                <span id="duration-value">15s</span>
                <input type="range" id="duration-slider" min="10" max="30" value="15" disabled>
            </label>
        </div>
    </div>

    <div id="webgl-container"></div>

    <script>
        // --- SETUP SCENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const select = document.getElementById('portal-select');
        const uiControls = document.getElementById('ui-controls');
        const fullscreenBorder = document.getElementById('fullscreen-top-border');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        let currentGroup = new THREE.Group();
        scene.add(currentGroup);

        let clock = new THREE.Clock();
        let uniforms = { u_time: { value: 0 } };
        let wakeLock = null;

        function createSoftParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createSoftParticleTexture();

        // --- GESTIONE FULLSCREEN IMMERSIVO ---
        async function enableImmersiveFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) return;

            const docEl = document.documentElement;
            try {
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen({ navigationUI: "hide" });
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen();
                }
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                uiControls.classList.add('hidden');
                fullscreenBorder.classList.add('active');
                hideTapToast();
                showSwipeToast();
            } catch (err) {
                console.log("Fullscreen request:", err);
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                uiControls.classList.remove('hidden');
                fullscreenBorder.classList.remove('active');
                showTapToast();
            }
        });

        container.addEventListener('click', enableImmersiveFullscreen);
        uiControls.addEventListener('click', (e) => e.stopPropagation());

        // --- TOAST NOTIFICATIONS ---
        let toastTimeout = null;

        function showTapToast() {
            const toast = document.getElementById('tap-toast');
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function hideTapToast() {
            const toast = document.getElementById('tap-toast');
            toast.classList.remove('show');
        }

        function showSwipeToast() {
            const toast = document.getElementById('swipe-toast');
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Show tap toast on load
        showTapToast();

        // --- SWIPE GESTURE PER SWITCH PORTALI IN FULLSCREEN ---
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        container.addEventListener('touchstart', (e) => {
            if (!document.fullscreenElement) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            isSwiping = true;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isSwiping || !document.fullscreenElement) return;
            e.preventDefault();
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (!isSwiping || !document.fullscreenElement) return;
            isSwiping = false;

            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;
            const absDeltaX = Math.abs(deltaX);
            const absDeltaY = Math.abs(deltaY);

            // Only trigger if horizontal swipe > 50px and more horizontal than vertical
            if (absDeltaX > 50 && absDeltaX > absDeltaY * 1.5) {
                const options = Array.from(select.options);
                const currentIndex = select.selectedIndex;
                let newIndex;

                if (deltaX < 0) {
                    // Swipe left → next portal
                    newIndex = (currentIndex + 1) % options.length;
                } else {
                    // Swipe right → previous portal
                    newIndex = (currentIndex - 1 + options.length) % options.length;
                }

                select.selectedIndex = newIndex;
                switchPortal(options[newIndex].value);
            }
        }, { passive: true });

        // --- GENERATORI DI PORTALI ---

        function buildNetherPortal() {
            const group = new THREE.Group();

            const portalMaterial = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ; m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vec2 st = vUv * 3.5;
                        float n = snoise(st + vec2(0.0, u_time * 0.4));
                        float n2 = snoise(st * 2.0 - vec2(u_time * 0.2, 0.0));
                        float finalNoise = (n + n2) * 0.5;

                        vec3 color1 = vec3(0.2, 0.0, 0.4);
                        vec3 color2 = vec3(0.8, 0.1, 0.9);
                        vec3 finalColor = mix(color1, color2, finalNoise + 0.5);

                        float alpha = smoothstep(0.5, 0.0, length(vUv - vec2(0.5)));
                        gl_FragColor = vec4(finalColor, alpha * 0.85);
                    }
                `
            });

            const planeGeo = new THREE.PlaneGeometry(4.5, 6.5, 32, 32);
            const portalMesh = new THREE.Mesh(planeGeo, portalMaterial);
            group.add(portalMesh);

            const particleCount = 1500;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 4;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 6 - 1.5;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
                velocities.push({ y: Math.random() * 0.02 + 0.005, x: (Math.random() - 0.5) * 0.005 });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const pMat = new THREE.PointsMaterial({
                size: 0.12,
                color: 0xda70d6,
                transparent: true,
                opacity: 0.7,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(geo, pMat);
            group.add(particles);

            group.userData.update = () => {
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3] += velocities[i].x;
                    if (positions[i * 3 + 1] > 3.2) {
                        positions[i * 3 + 1] = -4.8;
                        positions[i * 3] = (Math.random() - 0.5) * 4;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            };

            return group;
        }

        function buildDoctorStrangePortal() {
            const group = new THREE.Group();
            const particleCount = 6000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            const colorSpark1 = new THREE.Color(0xff6600);
            const colorSpark2 = new THREE.Color(0xffcc00);

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 1.8 + (Math.random() - 0.5) * 0.3;
                
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = Math.sin(angle) * radius;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

                const c = Math.random() > 0.5 ? colorSpark1 : colorSpark2;
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                pData.push({
                    angle: angle,
                    radius: radius,
                    speed: Math.random() * 0.04 + 0.02,
                    tangentalSpeed: (Math.random() - 0.5) * 0.05
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const ring = new THREE.Points(geo, mat);
            group.add(ring);

            group.userData.update = () => {
                const posArr = ring.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;
                    pData[i].radius += pData[i].tangentalSpeed * 0.1;

                    if (Math.abs(pData[i].radius - 1.8) > 0.5) {
                        pData[i].radius = 1.8 + (Math.random() - 0.5) * 0.2;
                    }

                    posArr[i * 3] = Math.cos(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 1] = Math.sin(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 2] += (Math.random() - 0.5) * 0.02;
                }
                ring.geometry.attributes.position.needsUpdate = true;
                group.rotation.z += 0.002;
            };

            return group;
        }

        function buildCosmicVortex() {
            const group = new THREE.Group();
            const particleCount = 15000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 1.2 + 0.8; // anello che non copre il buco nero
                const z = (Math.random() - 0.5) * -0.5;
                
                // Disco frontale: particelle sul piano X-Y con profondità Z
                positions[i * 3] = Math.cos(angle) * dist * 0.85;
                positions[i * 3 + 1] = Math.sin(angle) * dist;
                positions[i * 3 + 2] = z;

                pData.push({
                    dist: dist,
                    angle: angle,
                    z: z,
                    baseZ: z,
                    baseHue: (dist * 0.15) % 1.0,
                    speed: 0.012 + Math.random() * 0.008
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            group.add(points);

            // Buco nero centrale (cerchio nero)
            const holeGeo = new THREE.CircleGeometry(0.7, 32);
            const holeMat = new THREE.MeshBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const holeMesh = new THREE.Mesh(holeGeo, holeMat);
            holeMesh.position.z = -0.5;
            group.add(holeMesh);

            // Particelle bianche grandi che vengono inghiottite dal buco nero
            const swallowCount = 200;
            const swallowGeo = new THREE.BufferGeometry();
            const swallowPos = new Float32Array(swallowCount * 3);
            const swallowCol = new Float32Array(swallowCount * 3);
            const swallowData = [];

            for (let i = 0; i < swallowCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 1.5 + Math.random() * 1.5;

                swallowPos[i*3] = Math.cos(angle) * radius * 0.85;
                swallowPos[i*3+1] = Math.sin(angle) * radius;
                swallowPos[i*3+2] = 0;

                swallowCol[i*3] = 1.0;
                swallowCol[i*3+1] = 1.0;
                swallowCol[i*3+2] = 1.0;

                swallowData.push({
                    angle: angle,
                    radius: radius,
                    speed: 0.02 + Math.random() * 0.03
                });
            }

            swallowGeo.setAttribute('position', new THREE.BufferAttribute(swallowPos, 3));
            swallowGeo.setAttribute('color', new THREE.BufferAttribute(swallowCol, 3));

            const swallowMat = new THREE.PointsMaterial({
                size: 0.12,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const swallowPoints = new THREE.Points(swallowGeo, swallowMat);
            group.add(swallowPoints);

            // Lampi random organici (radiali)
            const flashGeo = new THREE.PlaneGeometry(5, 6);
            const flashMat = new THREE.ShaderMaterial({
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide,
                uniforms: {
                    u_opacity: { value: 0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_opacity;
                    varying vec2 vUv;
                    void main() {
                        vec2 pos = vUv - 0.5;
                        float dist = length(pos);
                        float falloff = smoothstep(0.5, 0.0, dist);
                        falloff = pow(falloff, 2.0);
                        gl_FragColor = vec4(1.0, 1.0, 1.0, falloff * u_opacity);
                    }
                `
            });
            const flashMesh = new THREE.Mesh(flashGeo, flashMat);
            flashMesh.position.z = -0.3;
            group.add(flashMesh);

            let flashIntensity = 0;
            let flashCooldown = Math.random() * 3;

            group.userData.update = () => {
                const posArr = points.geometry.attributes.position.array;
                const colArr = points.geometry.attributes.color.array;
                const time = uniforms.u_time.value;

                const colorObj = new THREE.Color();

                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;

                            float flick = 0.5 + 0.5 * sin(time * 25.0 + fi * 10.0 + angle * 5.0);
                            flick = flick * flick * flick;
                            
                            float rimDist = abs(dist - 0.35);
                            float rimGlow = smoothstep(0.05, 0.0, rimDist);
                            
                            arcs += arc * rimGlow * flick * (0.4 + seed * 0.6);

        function buildWaterPortal() {
            const group = new THREE.Group();

            const waterGeo = new THREE.PlaneGeometry(6, 6, 128, 128);
            const waterMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                side: THREE.DoubleSide,
                vertexShader: `
                    uniform float u_time;
                    varying vec2 vUv;
                    varying float vElevation;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ; m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        
                        float dist = length(vUv - vec2(0.5));
                        float wave = sin(dist * 35.0 - u_time * 4.0) * 0.15;
                        float noise = snoise(vUv * 6.0 + vec2(u_time * 0.3)) * 0.1;
                        
                        pos.z += wave + noise;
                        vElevation = pos.z;

                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;
                    varying float vElevation;

                    void main() {
                        float dist = length(vUv - vec2(0.5));
                        if(dist > 0.48) discard;

                        vec3 deepWater = vec3(0.0, 0.1, 0.3);
                        vec3 shallowWater = vec3(0.0, 0.7, 0.9);
                        vec3 foam = vec3(0.9, 1.0, 1.0);

                        vec3 color = mix(deepWater, shallowWater, vElevation * 2.0 + 0.5);
                        color = mix(color, foam, smoothstep(0.12, 0.22, vElevation));

                        float alpha = smoothstep(0.48, 0.35, dist);
                        gl_FragColor = vec4(color, alpha * 0.85);
                    }
                `
            });

            const waterMesh = new THREE.Mesh(waterGeo, waterMat);
            group.add(waterMesh);

            group.userData.update = () => {
                waterMesh.rotation.z += 0.001;
            };

            return group;
        }

        function buildFirePortal() {
            const group = new THREE.Group();

            // Shader fiamma organica e fluida
            const fireMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    // Hash veloce
                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                    }

                    // Smooth noise 2D
                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(hash(i), hash(i + vec2(1,0)), f.x),
                            mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x),
                            f.y
                        );
                    }

                    // FBM noise per dettaglio organico
                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 3; i++) {
                            v += a * noise(p);
                            p *= 2.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = vUv;
                        float time = u_time;
                        
                        // Maschera circolare
                        vec2 pos = uv - 0.5;
                        float dist = length(pos);
                        float mask = smoothstep(0.45, 0.0, dist);
                        
                        // Coordinate fiamma con distorsione
                        vec2 fUv = (uv - 0.5) * 1.5 + 0.5;
                        
                        // Turbolenza fluida
                        float turb = fbm(vec2(fUv.x * 2.0 + time * 0.3, fUv.y * 2.0 - time * 0.2));
                        float turb2 = fbm(vec2(fUv.x * 4.0 - time * 0.4, fUv.y * 3.0 + time * 0.3));
                        
                        // Forma base della fiamma (cupola)
                        float flameShape = 1.0 - dist * 2.0;
                        flameShape = max(0.0, flameShape);
                        flameShape = pow(flameShape, 1.2);
                        
                        // Lingue di fuoco con FBM
                        float flame1 = fbm(vec2(fUv.x * 5.0 + time * 0.5, fUv.y * 4.0 - time * 0.6));
                        float flame2 = fbm(vec2(fUv.x * 3.0 - time * 0.3, fUv.y * 3.0 - time * 0.4));
                        float flame3 = fbm(vec2(fUv.x * 7.0 + time * 0.2, fUv.y * 5.0 - time * 0.8));
                        
                        // Combina le fiamme
                        float flame = flame1 * 0.5 + flame2 * 0.3 + flame3 * 0.2;
                        flame = flame * flameShape;
                        flame *= 1.0 + (turb - 0.5) * 0.6;
                        flame = pow(flame, 1.8);
                        
                        // Schiarisci il centro
                        float core = smoothstep(0.3, 0.0, dist) * 0.3;
                        core += pow(1.0 - dist * 2.0, 2.0) * 0.2;
                        
                        // Scintillio intermittente
                        float sparkle = pow(max(0.0, sin(time * 5.7 + pos.x * 20.0)), 40.0);
                        sparkle += pow(max(0.0, sin(time * 7.3 + pos.y * 25.0)), 50.0);
                        
                        // Colori fuoco
                        vec3 c1 = vec3(1.0, 0.05, 0.0);
                        vec3 c2 = vec3(1.0, 0.4, 0.0);
                        vec3 c3 = vec3(1.0, 0.8, 0.1);
                        vec3 c4 = vec3(1.0, 1.0, 0.9);
                        
                        // Mix colore basato sull'intensità

                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                    }

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(hash(i), hash(i + vec2(1,0)), f.x),
                            mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x),
                            f.y
                        );
                    }

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 3; i++) {
                            v += a * noise(p);
                            p *= 2.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = vUv;
                        float time = u_time;
                        
                        // Maschera circolare
                        vec2 pos = uv - 0.5;
                        float dist = length(pos);
                        float mask = smoothstep(0.45, 0.0, dist);
                        float angle = atan(pos.y, pos.x);
                        
                        // Coordinate con rotazione lenta
                        float rot = time * 0.05;
                        float ca = cos(rot);
                        float sa = sin(rot);
                        vec2 rUv = vec2(pos.x * ca - pos.y * sa, pos.x * sa + pos.y * ca) * 2.0 + 0.5;
                        
                        // Membrane aliene pulsanti
                        float membrane1 = fbm(vec2(rUv.x * 3.0 + time * 0.2, rUv.y * 3.0 - time * 0.15));
                        float membrane2 = fbm(vec2(rUv.x * 5.0 - time * 0.3, rUv.y * 4.0 + time * 0.2));
                        float membrane3 = fbm(vec2(rUv.x * 2.0 + time * 0.1, rUv.y * 6.0 + time * 0.4));
                        
                        // Pattern alieno
                        float pattern = membrane1 * 0.5 + membrane2 * 0.3 + membrane3 * 0.2;
                        
                        // Pulsazione organica
                        float pulse = 0.5 + 0.5 * sin(time * 0.8 + dist * 3.0);
                        float pulse2 = 0.5 + 0.5 * sin(time * 1.2 + angle * 4.0);
                        
                        // Vene luminose
                        float veins = sin(dist * 20.0 - time * 0.5 + angle * 6.0) * 0.5 + 0.5;
                        veins = pow(veins, 4.0);
                        veins *= smoothstep(0.4, 0.0, dist);
                        
                        // Anelli concentrici pulsanti
                        float rings = sin(dist * 12.0 - time * 0.6) * 0.5 + 0.5;
                        rings = pow(rings, 6.0);
                        
                        // Bolle che fluttuano
                        float bubbles = 0.0;
                        for (int i = 0; i < 4; i++) {
                            float fi = float(i);
                            float bx = 0.5 + 0.3 * cos(time * 0.2 + fi * 1.5);
                            float by = 0.5 + 0.3 * sin(time * 0.3 + fi * 2.0);
                            float bd = length(uv - vec2(bx, by));
                            bubbles += smoothstep(0.08, 0.0, bd) * 0.3;
                        }
                        
                        // Forma base
                        float shape = pow(1.0 - dist * 1.8, 1.5);
                        shape = max(0.0, shape);
                        
                        // Colori alieni (verde/biologico)
                        vec3 col1 = vec3(0.0, 0.6, 0.3);
                        vec3 col2 = vec3(0.0, 0.9, 0.5);
                        vec3 col3 = vec3(0.2, 1.0, 0.7);
                        vec3 col4 = vec3(0.8, 1.0, 0.5);
                        
                        // Mix colore
                        float intensity = pattern * shape + veins * 0.4 + rings * 0.3 + bubbles * 0.5;

                        color = mix(color, col3, smoothstep(0.3, 0.7, intensity));
                        color = mix(color, col4, smoothstep(0.6, 1.0, intensity));
                        
                        // Pelle aliena
                        float skin = fbm(vec2(pos.x * 8.0 + time * 0.1, pos.y * 8.0 + time * 0.05));
                        color += col3 * skin * 0.08;
                        
                        // Bordo glow verde
                        float edge = smoothstep(0.48, 0.35, dist) * 0.1;
                        color += col2 * edge;
                        
                        float alpha = (intensity * 0.8 + shape * 0.2 + edge) * mask;
                        gl_FragColor = vec4(color, alpha);
                    }

                        return mix(

                            mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), f.x),

                        );

                    float fbm(vec2 p) {

                            a *= 0.5;

                    void main() {

                        // Griglia esagonale per scaglie
                        vec2 h = distorted * vec2(1.0, 1.1547);
                        vec2 a = mod(h, 1.0) - 0.5;
                        vec2 b = mod(h + vec2(0.5, 0.5), 1.0) - 0.5;
                        float d = min(dot(a, a), dot(b, b));
                        
                        float scaleEdge = smoothstep(0.15, 0.25, d);

                        vec3 cWhite = vec3(1.0, 0.95, 0.8);

                        float t = scales * 0.5 + breath * 0.3 + swirl * 0.2;
                        vec3 color = mix(cDark, cRed, smoothstep(0.0, 0.4, t));
                        color = mix(color, cOrange, smoothstep(0.3, 0.6, t));
                        color = mix(color, cGold, smoothstep(0.5, 0.8, t));
                        color = mix(color, cWhite, smoothstep(0.7, 1.0, t));

                        color += cOrange * swirl * 0.3;
                        
                        // Glow sui bordi delle scaglie

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 4; i++) {
                            v += a * noise(p);
                            p *= 2.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = vUv;
                        float time = u_time;
                        
                        // Maschera circolare
                        vec2 pos = uv - 0.5;
                        float dist = length(pos);
                        float mask = smoothstep(0.48, 0.0, dist);
                        
                        // Glassmorphism: effetto vetro satinato con distorsione
                        vec2 glassUv = pos;
                        glassUv.x += fbm(uv * 4.0 + time * 0.15) * 0.1;
                        glassUv.y += fbm(uv * 4.0 + vec2(time * 0.12, 0.0)) * 0.1;
                        
                        // Pattern di luce attraverso il vetro
                        float glassPattern = fbm(glassUv * 6.0 + time * 0.2);
                        float glassPattern2 = fbm(glassUv * 3.0 - time * 0.1);
                        
                        // Raggi di luce dal centro
                        float angle = atan(pos.y, pos.x);
                        float rays = sin(angle * 8.0 + time * 0.5) * 0.5 + 0.5;
                        rays = pow(rays, 3.0);
                        rays *= smoothstep(0.45, 0.0, dist);
                        
                        // Bagliore centrale pulsante
                        float glow = 1.0 - smoothstep(0.0, 0.3, dist);
                        glow = pow(glow, 2.0);
                        glow *= 0.5 + 0.5 * sin(time * 1.5);
                        
                        // Onde di luce celestiali
                        float waves = sin(dist * 15.0 - time * 2.0) * 0.5 + 0.5;
                        waves = pow(waves, 4.0);
                        waves *= smoothstep(0.4, 0.1, dist);
                        
                        // Colori celestiali
                        vec3 cWhite = vec3(1.0, 1.0, 1.0);
                        vec3 cGold = vec3(1.0, 0.9, 0.6);
                        vec3 cLightBlue = vec3(0.7, 0.9, 1.0);
                        vec3 cPink = vec3(1.0, 0.8, 0.9);
                        vec3 cLavender = vec3(0.9, 0.8, 1.0);
                        vec3 cCyan = vec3(0.6, 0.95, 1.0);
                        
                        // Mix colore basato su pattern e distanza
                        float t = glassPattern * 0.4 + glassPattern2 * 0.3 + glow * 0.3;
                        vec3 color = mix(cLightBlue, cWhite, smoothstep(0.0, 0.5, t));
                        color = mix(color, cGold, smoothstep(0.3, 0.7, t));
                        color = mix(color, cPink, smoothstep(0.5, 0.8, glassPattern2));
                        color = mix(color, cLavender, smoothstep(0.6, 0.9, glassPattern));

                        color += cGold * rays * 0.3;
                        color += cWhite * glow * 0.5;
                        color += cCyan * waves * 0.2;
                        
                        // Bordo glassmorphism
                        float edge = smoothstep(0.48, 0.4, dist) * (1.0 - smoothstep(0.4, 0.35, dist));
                        color += cWhite * edge * 0.6;
                        
                        // Riflesso superiore (effetto vetro)

                        color += cWhite * reflection * 0.3;
                        
                        float alpha = (glassPattern * 0.3 + glassPattern2 * 0.2 + glow * 0.4 + rays * 0.2 + waves * 0.15 + edge * 0.5 + reflection * 0.3) * mask;
                        gl_FragColor = vec4(color, alpha * 0.85);
                    }
                `

            const plane = new THREE.PlaneGeometry(5, 7, 1, 1);

            // Fontana di luce - particelle che schizzano verso l'alto e ricadono

                    rCol[i*3] = colObj.r;
                    rCol[i*3+1] = colObj.g;
                    rCol[i*3+2] = colObj.b;

                rayPoints.geometry.attributes.color.needsUpdate = true;
                
                // Aggiorna fontana di luce
                const fPos = fountainPoints.geometry.attributes.position.array;
                const fCol = fountainPoints.geometry.attributes.color.array;
                
                for (let i = 0; i < fountainCount; i++) {
                    fountainData[i].life += 0.008;
                    
                    if (fountainData[i].life > 1) {

                        const speed = 0.02 + Math.random() * 0.04;
                        fountainData[i].vx = Math.cos(angle) * speed * 0.5;
                        fountainData[i].vy = speed;
                        fountainData[i].vz = Math.sin(angle) * speed * 0.3;
                        fPos[i*3] = 0;
                        fPos[i*3+1] = 0;
                        fPos[i*3+2] = 0;
                    }
                    
                    fountainData[i].vy -= fountainData[i].gravity;
                    fPos[i*3] += fountainData[i].vx;
                    fPos[i*3+1] += fountainData[i].vy;
                    fPos[i*3+2] += fountainData[i].vz;
                    
                    const pulse = Math.sin(fountainData[i].life * Math.PI);
                    const hue = 0.55 + pulse * 0.15;
                    colObj.setHSL(hue, 0.5, 0.6 + pulse * 0.3);

                    fCol[i*3+1] = colObj.g;

                fountainPoints.geometry.attributes.color.needsUpdate = true;
                
                // Aggiorna anelli espandenti
                const rePos = ringExpPoints.geometry.attributes.position.array;

                    const pulse = Math.sin(ringData[i].life * Math.PI);
                    const hue = ringData[i].ringIdx === 0 ? 0.0 : (ringData[i].ringIdx === 1 ? 0.12 : 0.55);

            };

            return group;

        function buildAuroraPortal() {
            const group = new THREE.Group();

            // Shader aurora boreale con cortine di luce fluide
            const auroraMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                    }

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(hash(i), hash(i + vec2(1.0,0.0)), f.x),
                            mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), f.x),
                            f.y
                        );
                    }

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 5; i++) {
                            v += a * noise(p);
                            p *= 2.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = vUv;
                        float time = u_time;
                        
                        // Maschera circolare
                        vec2 pos = uv - 0.5;
                        float dist = length(pos);
                        float mask = smoothstep(0.48, 0.0, dist);
                        
                        // Cortine di luce verticali che fluiscono
                        // Onda principale che si muove verticalmente
                        float curtainWave = fbm(vec2(uv.x * 3.0 + time * 0.15, uv.y * 2.0 - time * 0.1));
                        
                        // Seconda onda con frequenza diversa
                        float curtain2 = fbm(vec2(uv.x * 5.0 - time * 0.08, uv.y * 3.0 + time * 0.12));
                        
                        // Strisce verticali di luce (cortine)
                        float stripes = sin(uv.x * 15.0 + curtainWave * 5.0 + time * 0.3) * 0.5 + 0.5;
                        stripes = pow(stripes, 2.0);
                        
                        // Flusso verticale (le cortine pendono dall'alto)
                        float verticalFlow = 1.0 - smoothstep(0.3, 0.7, uv.y);
                        verticalFlow = pow(verticalFlow, 1.5);
                        
                        // Intensità della cortina
                        float curtainIntensity = curtainWave * 0.5 + curtain2 * 0.3 + stripes * 0.2;
                        curtainIntensity *= verticalFlow;
                        curtainIntensity *= smoothstep(0.0, 0.2, uv.y) * smoothstep(1.0, 0.8, uv.y);
                        
                        // Bagliore pulsante al centro
                        float glow = 1.0 - smoothstep(0.0, 0.25, dist);
                        glow = pow(glow, 2.0);
                        glow *= 0.5 + 0.5 * sin(time * 1.2);
                        
                        // Onde di luce orizzontali
                        float waves = sin(dist * 12.0 - time * 1.5) * 0.5 + 0.5;
                        waves = pow(waves, 3.0);
                        waves *= smoothstep(0.4, 0.1, dist);
                        
                        // Scintillio stellare
                        float sparkle = pow(max(0.0, sin(time * 8.0 + uv.x * 50.0)), 30.0);
                        sparkle += pow(max(0.0, sin(time * 6.0 + uv.y * 40.0)), 25.0);
                        sparkle *= smoothstep(0.4, 0.0, dist);
                        
                        // Colori aurora: verde, turchese, viola, rosa, bianco
                        vec3 cGreen = vec3(0.2, 1.0, 0.4);
                        vec3 cTeal = vec3(0.2, 0.9, 0.8);
                        vec3 cPurple = vec3(0.6, 0.3, 1.0);
                        vec3 cPink = vec3(0.9, 0.4, 0.8);
                        vec3 cWhite = vec3(0.9, 1.0, 0.95);
                        vec3 cBlue = vec3(0.3, 0.5, 1.0);
                        
                        // Mix colore basato sulle cortine
                        float t = curtainIntensity;
                        vec3 color = mix(cBlue, cGreen, smoothstep(0.0, 0.4, t));
                        color = mix(color, cTeal, smoothstep(0.2, 0.5, t));
                        color = mix(color, cPurple, smoothstep(0.3, 0.6, curtain2));
                        color = mix(color, cPink, smoothstep(0.5, 0.8, curtainWave));
                        color = mix(color, cWhite, smoothstep(0.7, 1.0, t));
                        
                        // Aggiungi bagliore e onde
                        color += cGreen * glow * 0.4;
                        color += cTeal * waves * 0.3;
                        color += cWhite * sparkle * 0.5;
                        
                        // Bordo luminoso
                        float edge = smoothstep(0.48, 0.4, dist) * (1.0 - smoothstep(0.4, 0.35, dist));
                        color += cTeal * edge * 0.4;
                        
                        float alpha = (curtainIntensity * 0.7 + glow * 0.3 + waves * 0.2 + sparkle * 0.3 + edge * 0.4) * mask;
                        gl_FragColor = vec4(color, alpha * 0.9);
                    }
                `
            });
