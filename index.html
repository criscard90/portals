<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portali Magici Cinematografici 3D</title>
    
    <!-- Configurazione PWA Fullscreen Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <!-- Librerie Esterne: Three.js per 3D/GLSL e GSAP per fluidità organica -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Control Overlay Float */
        #ui-controls {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            background: rgba(10, 10, 16, 0.85);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #ui-controls.hidden {
            opacity: 0;
            transform: translate(-50%, -30px);
            pointer-events: none;
        }

        select, button {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        select option {
            background: #0f0f15;
            color: #fff;
        }

        button:hover, select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        #toggle-ui {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 10;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.4;
            transition: opacity 0.3s, transform 0.2s;
            cursor: pointer;
        }

        #toggle-ui:active {
            transform: scale(0.92);
        }

        #toggle-ui:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="ui-controls">
        <select id="portal-select">
            <option value="nether">1. Nether Portal (Lava & Plasma Procedurale)</option>
            <option value="doctor">2. Anello Arcano (Doctor Strange High-Density)</option>
            <option value="cosmic">3. Vortex Galattico Organico</option>
            <option value="supernova">4. Supernova Core (Esplosione Stellare)</option>
            <option value="wormhole" selected>5. Wormhole Iperspazio (Volo ad Alta Velocità)</option>
            <option value="quantum">6. Portale Quantistico Fluidodinamico</option>
        </select>
        <button id="btn-fullscreen">📌 Tutto Schermo</button>
    </div>

    <button id="toggle-ui" title="Mostra/Nascondi Controlli">⚙️</button>

    <div id="webgl-container"></div>

    <script>
        // --- SETUP SCENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const select = document.getElementById('portal-select');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const uiControls = document.getElementById('ui-controls');
        const toggleUi = document.getElementById('toggle-ui');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        let currentGroup = new THREE.Group();
        scene.add(currentGroup);

        let clock = new THREE.Clock();
        let uniforms = { u_time: { value: 0 } };
        let wakeLock = null;

        function createSoftParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createSoftParticleTexture();

        // --- GESTIONE FULLSCREEN IMMERSIVO ---
        async function enableImmersiveFullscreen() {
            const docEl = document.documentElement;
            try {
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen({ navigationUI: "hide" });
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen();
                }
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                uiControls.classList.add('hidden');
            } catch (err) {
                console.log("Fullscreen request:", err);
            }
        }

        btnFullscreen.addEventListener('click', enableImmersiveFullscreen);
        toggleUi.addEventListener('click', () => uiControls.classList.toggle('hidden'));

        // --- GENERATORI DI PORTALI ---

        function buildNetherPortal() {
            const group = new THREE.Group();

            const portalMaterial = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ; m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vec2 st = vUv * 3.5;
                        float n = snoise(st + vec2(0.0, u_time * 0.4));
                        float n2 = snoise(st * 2.0 - vec2(u_time * 0.2, 0.0));
                        float finalNoise = (n + n2) * 0.5;

                        vec3 color1 = vec3(0.2, 0.0, 0.4);
                        vec3 color2 = vec3(0.8, 0.1, 0.9);
                        vec3 finalColor = mix(color1, color2, finalNoise + 0.5);

                        float alpha = smoothstep(0.5, 0.0, length(vUv - vec2(0.5)));
                        gl_FragColor = vec4(finalColor, alpha * 0.85);
                    }
                `
            });

            const planeGeo = new THREE.PlaneGeometry(4.5, 6.5, 32, 32);
            const portalMesh = new THREE.Mesh(planeGeo, portalMaterial);
            group.add(portalMesh);

            const particleCount = 1500;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 4;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 6;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
                velocities.push({ y: Math.random() * 0.02 + 0.005, x: (Math.random() - 0.5) * 0.005 });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const pMat = new THREE.PointsMaterial({
                size: 0.12,
                color: 0xda70d6,
                transparent: true,
                opacity: 0.7,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(geo, pMat);
            group.add(particles);

            group.userData.update = () => {
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3] += velocities[i].x;
                    if (positions[i * 3 + 1] > 3.2) {
                        positions[i * 3 + 1] = -3.2;
                        positions[i * 3] = (Math.random() - 0.5) * 4;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            };

            return group;
        }

        function buildDoctorStrangePortal() {
            const group = new THREE.Group();
            const particleCount = 8000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            const colorSpark1 = new THREE.Color(0xff6600);
            const colorSpark2 = new THREE.Color(0xffcc00);

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 2.5 + (Math.random() - 0.5) * 0.4;
                
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = Math.sin(angle) * radius;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

                const c = Math.random() > 0.5 ? colorSpark1 : colorSpark2;
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                pData.push({
                    angle: angle,
                    radius: radius,
                    speed: Math.random() * 0.04 + 0.02,
                    tangentalSpeed: (Math.random() - 0.5) * 0.05
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const ring = new THREE.Points(geo, mat);
            group.add(ring);

            group.userData.update = () => {
                const posArr = ring.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;
                    pData[i].radius += pData[i].tangentalSpeed * 0.1;

                    if (Math.abs(pData[i].radius - 2.5) > 0.6) {
                        pData[i].radius = 2.5 + (Math.random() - 0.5) * 0.3;
                    }

                    posArr[i * 3] = Math.cos(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 1] = Math.sin(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 2] += (Math.random() - 0.5) * 0.02;
                }
                ring.geometry.attributes.position.needsUpdate = true;
                group.rotation.z += 0.002;
            };

            return group;
        }

        function buildCosmicVortex() {
            const group = new THREE.Group();
            const particleCount = 12000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            for (let i = 0; i < particleCount; i++) {
                const dist = Math.random() * 5 + 0.2;
                const angle = Math.random() * Math.PI * 2;
                
                positions[i * 3] = Math.cos(angle) * dist;
                positions[i * 3 + 1] = Math.sin(angle) * dist;
                positions[i * 3 + 2] = (Math.random() - 0.5) * (6.0 - dist);

                const color = new THREE.Color();
                color.setHSL(0.55 + dist * 0.05, 0.9, 0.5 + Math.random() * 0.3);

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                pData.push({
                    dist: dist,
                    angle: angle,
                    speed: (1 / (dist + 0.5)) * 0.03
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.06,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            group.add(points);

            group.userData.update = () => {
                const posArr = points.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;
                    pData[i].dist -= 0.003;

                    if (pData[i].dist <= 0.2) {
                        pData[i].dist = 5;
                    }

                    posArr[i * 3] = Math.cos(pData[i].angle) * pData[i].dist;
                    posArr[i * 3 + 1] = Math.sin(pData[i].angle) * pData[i].dist;
                }
                points.geometry.attributes.position.needsUpdate = true;
                group.rotation.z -= 0.001;
            };

            return group;
        }

        function buildSupernovaCore() {
            const group = new THREE.Group();

            const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff0aa });
            const core = new THREE.Mesh(coreGeo, coreMat);
            group.add(core);

            const plasmaGeo = new THREE.SphereGeometry(1.8, 64, 64);
            const plasmaMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.5);
                        vec3 col = mix(vec3(1.0, 0.2, 0.0), vec3(1.0, 0.8, 0.1), sin(u_time * 4.0) * 0.5 + 0.5);
                        gl_FragColor = vec4(col, intensity * 0.9);
                    }
                `
            });
            const plasma = new THREE.Mesh(plasmaGeo, plasmaMat);
            group.add(plasma);

            const count = 5000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const pData = [];

            const c1 = new THREE.Color(0xff2200);
            const c2 = new THREE.Color(0xffaa00);
            const c3 = new THREE.Color(0xffffff);

            for(let i = 0; i < count; i++) {
                const dir = new THREE.Vector3(
                    Math.random() - 0.5,
                    Math.random() - 0.5,
                    Math.random() - 0.5
                ).normalize();

                const speed = Math.random() * 0.03 + 0.01;
                const dist = Math.random() * 4.5 + 0.2;

                pos[i*3] = dir.x * dist;
                pos[i*3+1] = dir.y * dist;
                pos[i*3+2] = dir.z * dist;

                const randC = Math.random();
                const c = randC > 0.7 ? c3 : (randC > 0.3 ? c2 : c1);
                colors[i*3] = c.r;
                colors[i*3+1] = c.g;
                colors[i*3+2] = c.b;

                pData.push({ dir, dist, speed });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const blast = new THREE.Points(geo, mat);
            group.add(blast);

            group.userData.update = () => {
                const t = uniforms.u_time.value;
                core.scale.setScalar(1 + Math.sin(t * 5) * 0.08);
                plasma.scale.setScalar(1 + Math.cos(t * 3) * 0.06);

                const posArr = blast.geometry.attributes.position.array;
                for(let i = 0; i < count; i++) {
                    pData[i].dist += pData[i].speed;
                    if(pData[i].dist > 4.8) {
                        pData[i].dist = 0.3;
                    }
                    posArr[i*3] = pData[i].dir.x * pData[i].dist;
                    posArr[i*3+1] = pData[i].dir.y * pData[i].dist;
                    posArr[i*3+2] = pData[i].dir.z * pData[i].dist;
                }
                blast.geometry.attributes.position.needsUpdate = true;
                group.rotation.y += 0.003;
            };

            return group;
        }

        // ANIMAZIONE: Volo Iperspazio Infinito Rettilineo (Senza Rotazione Z)
        function buildWormhole() {
            const group = new THREE.Group();

            // 1. Mesh del Tunnel
            const tunnelGeo = new THREE.CylinderGeometry(3.5, 3.5, 80, 32, 120, true);
            const tunnelMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    void main() {
                        // Scorrimento velocissimo lungo la profondità (Y)
                        float speed = u_time * 18.0;
                        
                        // Linee d'energia longitudinali diritte (senza oscillazioni)
                        float streak = sin(vUv.x * 80.0) * 0.5 + 0.5;
                        float pulse = sin(vUv.y * 60.0 - speed) * 0.5 + 0.5;
                        
                        // Palette Iperspazio Neon
                        vec3 col1 = vec3(0.0, 0.8, 1.0);
                        vec3 col2 = vec3(0.6, 0.0, 1.0);
                        
                        vec3 finalCol = mix(col1, col2, pulse);

                        // Fade out agli estremi per non far vedere i bordi della geometria
                        float alpha = smoothstep(0.0, 0.15, vUv.y) * smoothstep(1.0, 0.85, vUv.y);

                        gl_FragColor = vec4(finalCol, (streak * 0.8 + pulse * 0.4) * alpha);
                    }
                `
            });

            const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnel.rotation.x = Math.PI / 2;
            group.add(tunnel);

            // 2. Particelle "Warp Speed" Rettilinee
            const count = 4000;
            const streakGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const speeds = [];

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 3.3 + 0.1;
                
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = Math.sin(angle) * radius;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 80;

                speeds.push(Math.random() * 1.2 + 0.8); // Molto veloci
            }

            streakGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const streakMat = new THREE.PointsMaterial({
                size: 0.12,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.95,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const warpParticles = new THREE.Points(streakGeo, streakMat);
            group.add(warpParticles);

            // Update pulito senza rotazioni
            group.userData.update = () => {
                const posArr = warpParticles.geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    posArr[i * 3 + 2] += speeds[i]; // Avanzamento rettilineo puro

                    if (posArr[i * 3 + 2] > 10) {
                        posArr[i * 3 + 2] = -60;
                    }
                }
                warpParticles.geometry.attributes.position.needsUpdate = true;
            };

            return group;
        }

        function buildQuantumPortal() {
            const group = new THREE.Group();
            const count = 4000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const pData = [];

            for(let i = 0; i < count; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * Math.PI * 2;
                const phi = Math.acos(2 * v - 1);
                const r = 2.5 + Math.sin(theta * 4) * 0.3;

                pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i*3+2] = r * Math.cos(phi) * 0.3;

                pData.push({ theta, phi, r, speed: Math.random() * 0.02 + 0.005 });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
                size: 0.07,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            group.add(points);

            group.userData.update = () => {
                const pArr = points.geometry.attributes.position.array;
                const t = uniforms.u_time.value;
                for(let i = 0; i < count; i++) {
                    pData[i].theta += pData[i].speed;
                    const r = 2.5 + Math.sin(pData[i].theta * 5 + t * 2) * 0.4;
                    
                    pArr[i*3] = r * Math.sin(pData[i].phi) * Math.cos(pData[i].theta);
                    pArr[i*3+1] = r * Math.sin(pData[i].phi) * Math.sin(pData[i].theta);
                }
                points.geometry.attributes.position.needsUpdate = true;
                group.rotation.z += 0.002;
            };

            return group;
        }

        // --- SWITCHER PORTALI CON GSAP ---
        function switchPortal(type) {
            gsap.to(currentGroup.scale, {
                x: 0, y: 0, z: 0, duration: 0.5, ease: "power2.in", onComplete: () => {
                    scene.remove(currentGroup);
                    
                    if (type === 'nether') currentGroup = buildNetherPortal();
                    else if (type === 'doctor') currentGroup = buildDoctorStrangePortal();
                    else if (type === 'cosmic') currentGroup = buildCosmicVortex();
                    else if (type === 'supernova') currentGroup = buildSupernovaCore();
                    else if (type === 'wormhole') currentGroup = buildWormhole();
                    else if (type === 'quantum') currentGroup = buildQuantumPortal();

                    currentGroup.scale.set(0, 0, 0);
                    scene.add(currentGroup);

                    gsap.to(currentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.8, ease: "back.out(1.4)" });
                }
            });
        }

        select.addEventListener('change', (e) => switchPortal(e.target.value));

        // Start Iniziale impostato direttamente sul Wormhole Iperspazio
        currentGroup = buildWormhole();
        scene.add(currentGroup);

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- RENDER LOOP ORGANICO ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            uniforms.u_time.value += delta;

            if (currentGroup && currentGroup.userData.update) {
                currentGroup.userData.update();
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
