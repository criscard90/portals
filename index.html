<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals</title>
    
    <!-- PWA Configurazione -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="application-name" content="Portals">
    <meta name="apple-mobile-web-app-title" content="Portals">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">

    <!-- Librerie Esterne: Three.js per 3D/GLSL e GSAP per fluidità organica -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Bordo nero superiore 10% per fullscreen */
        #fullscreen-top-border {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: #000;
            z-index: 100;
            pointer-events: none;
            transition: height 0.3s ease;
        }

        #fullscreen-top-border.active {
            height: 10vh;
        }

        /* Toast notifications */
        #tap-toast, #swipe-toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 0.5px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        #tap-toast {
            top: 80px;
        }

        #swipe-toast {
            top: 130px;
        }

        #tap-toast.show, #swipe-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* UI Selector Float */
        #ui-controls {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            background: rgba(10, 10, 16, 0.85);
            padding: 8px 14px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #ui-controls.hidden {
            opacity: 0;
            transform: translate(-50%, -30px);
            pointer-events: none;
        }

        select {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        select option {
            background: #0f0f15;
            color: #fff;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="fullscreen-top-border"></div>
    <div id="tap-toast">Tap to enter fullscreen</div>
    <div id="swipe-toast">← Swipe to switch portals →</div>

    <div id="ui-controls">
        <select id="portal-select">
            <option value="nether">Nether</option>
            <option value="doctor">Spark</option>
            <option value="cosmic" selected>Vortex</option>
            <option value="lightning">Storm</option>
            <option value="wormhole">Hyperdrive</option>
            <option value="quantum">Quantum</option>
            <option value="smoke">Mist</option>
            <option value="water">Aqua</option>
        </select>
    </div>

    <div id="webgl-container"></div>

    <script>
        // --- SETUP SCENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const select = document.getElementById('portal-select');
        const uiControls = document.getElementById('ui-controls');
        const fullscreenBorder = document.getElementById('fullscreen-top-border');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        let currentGroup = new THREE.Group();
        scene.add(currentGroup);

        let clock = new THREE.Clock();
        let uniforms = { u_time: { value: 0 } };
        let wakeLock = null;

        function createSoftParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createSoftParticleTexture();

        // --- GESTIONE FULLSCREEN IMMERSIVO ---
        async function enableImmersiveFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) return;

            const docEl = document.documentElement;
            try {
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen({ navigationUI: "hide" });
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen();
                }
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                uiControls.classList.add('hidden');
                fullscreenBorder.classList.add('active');
                hideTapToast();
                showSwipeToast();
            } catch (err) {
                console.log("Fullscreen request:", err);
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                uiControls.classList.remove('hidden');
                fullscreenBorder.classList.remove('active');
                showTapToast();
            }
        });

        container.addEventListener('click', enableImmersiveFullscreen);
        uiControls.addEventListener('click', (e) => e.stopPropagation());

        // --- TOAST NOTIFICATIONS ---
        let toastTimeout = null;

        function showTapToast() {
            const toast = document.getElementById('tap-toast');
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function hideTapToast() {
            const toast = document.getElementById('tap-toast');
            toast.classList.remove('show');
        }

        function showSwipeToast() {
            const toast = document.getElementById('swipe-toast');
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Show tap toast on load
        showTapToast();

        // --- SWIPE GESTURE PER SWITCH PORTALI IN FULLSCREEN ---
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        container.addEventListener('touchstart', (e) => {
            if (!document.fullscreenElement) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            isSwiping = true;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isSwiping || !document.fullscreenElement) return;
            e.preventDefault();
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (!isSwiping || !document.fullscreenElement) return;
            isSwiping = false;

            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;
            const absDeltaX = Math.abs(deltaX);
            const absDeltaY = Math.abs(deltaY);

            // Only trigger if horizontal swipe > 50px and more horizontal than vertical
            if (absDeltaX > 50 && absDeltaX > absDeltaY * 1.5) {
                const options = Array.from(select.options);
                const currentIndex = select.selectedIndex;
                let newIndex;

                if (deltaX < 0) {
                    // Swipe left → next portal
                    newIndex = (currentIndex + 1) % options.length;
                } else {
                    // Swipe right → previous portal
                    newIndex = (currentIndex - 1 + options.length) % options.length;
                }

                select.selectedIndex = newIndex;
                switchPortal(options[newIndex].value);
            }
        }, { passive: true });

        // --- GENERATORI DI PORTALI ---

        function buildNetherPortal() {
            const group = new THREE.Group();

            const portalMaterial = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ; m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vec2 st = vUv * 3.5;
                        float n = snoise(st + vec2(0.0, u_time * 0.4));
                        float n2 = snoise(st * 2.0 - vec2(u_time * 0.2, 0.0));
                        float finalNoise = (n + n2) * 0.5;

                        vec3 color1 = vec3(0.2, 0.0, 0.4);
                        vec3 color2 = vec3(0.8, 0.1, 0.9);
                        vec3 finalColor = mix(color1, color2, finalNoise + 0.5);

                        float alpha = smoothstep(0.5, 0.0, length(vUv - vec2(0.5)));
                        gl_FragColor = vec4(finalColor, alpha * 0.85);
                    }
                `
            });

            const planeGeo = new THREE.PlaneGeometry(4.5, 6.5, 32, 32);
            const portalMesh = new THREE.Mesh(planeGeo, portalMaterial);
            group.add(portalMesh);

            const particleCount = 1500;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 4;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 6 - 1.5;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
                velocities.push({ y: Math.random() * 0.02 + 0.005, x: (Math.random() - 0.5) * 0.005 });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const pMat = new THREE.PointsMaterial({
                size: 0.12,
                color: 0xda70d6,
                transparent: true,
                opacity: 0.7,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(geo, pMat);
            group.add(particles);

            group.userData.update = () => {
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3] += velocities[i].x;
                    if (positions[i * 3 + 1] > 3.2) {
                        positions[i * 3 + 1] = -4.8;
                        positions[i * 3] = (Math.random() - 0.5) * 4;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            };

            return group;
        }

        function buildDoctorStrangePortal() {
            const group = new THREE.Group();
            const particleCount = 6000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            const colorSpark1 = new THREE.Color(0xff6600);
            const colorSpark2 = new THREE.Color(0xffcc00);

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 1.8 + (Math.random() - 0.5) * 0.3;
                
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = Math.sin(angle) * radius;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

                const c = Math.random() > 0.5 ? colorSpark1 : colorSpark2;
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                pData.push({
                    angle: angle,
                    radius: radius,
                    speed: Math.random() * 0.04 + 0.02,
                    tangentalSpeed: (Math.random() - 0.5) * 0.05
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const ring = new THREE.Points(geo, mat);
            group.add(ring);

            group.userData.update = () => {
                const posArr = ring.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;
                    pData[i].radius += pData[i].tangentalSpeed * 0.1;

                    if (Math.abs(pData[i].radius - 1.8) > 0.5) {
                        pData[i].radius = 1.8 + (Math.random() - 0.5) * 0.2;
                    }

                    posArr[i * 3] = Math.cos(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 1] = Math.sin(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 2] += (Math.random() - 0.5) * 0.02;
                }
                ring.geometry.attributes.position.needsUpdate = true;
                group.rotation.z += 0.002;
            };

            return group;
        }

        function buildCosmicVortex() {
            const group = new THREE.Group();
            const particleCount = 12000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            for (let i = 0; i < particleCount; i++) {
                const dist = Math.random() * 4.8 + 0.3;
                const angle = Math.random() * Math.PI * 2;
                
                positions[i * 3] = Math.cos(angle) * dist;
                positions[i * 3 + 1] = Math.sin(angle) * dist;
                positions[i * 3 + 2] = (Math.random() - 0.5) * (3.0 - dist * 0.4);

                pData.push({
                    dist: dist,
                    angle: angle,
                    baseHue: (dist * 0.12) % 1.0,
                    speed: 0.012
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.065,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            group.add(points);

            group.userData.update = () => {
                const posArr = points.geometry.attributes.position.array;
                const colArr = points.geometry.attributes.color.array;
                const time = uniforms.u_time.value * 0.1;

                const colorObj = new THREE.Color();

                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;
                    pData[i].dist -= 0.002;

                    if (pData[i].dist <= 0.3) {
                        pData[i].dist = 5.1;
                    }

                    posArr[i * 3] = Math.cos(pData[i].angle) * pData[i].dist;
                    posArr[i * 3 + 1] = Math.sin(pData[i].angle) * pData[i].dist;

                    const currentHue = (0.55 + pData[i].baseHue + Math.sin(time + pData[i].dist * 0.5) * 0.2) % 1.0;
                    colorObj.setHSL(currentHue, 0.85, 0.55);

                    colArr[i * 3] = colorObj.r;
                    colArr[i * 3 + 1] = colorObj.g;
                    colArr[i * 3 + 2] = colorObj.b;
                }
                points.geometry.attributes.position.needsUpdate = true;
                points.geometry.attributes.color.needsUpdate = true;
            };

            return group;
        }

        function buildLightningPortal() {
            const group = new THREE.Group();

            // Shader per fulmini organici con branching dinamico
            const boltMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    // Hash per rumore pseudo-casuale
                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                    }

                    // Genera un fulmine con branching naturale
                    float lightningBolt(vec2 uv, float seed, float time) {
                        float intensity = 0.0;
                        
                        // Multipli fulmini con seed diversi
                        for (int b = 0; b < 6; b++) {
                            float fi = float(b);
                            vec2 offset = vec2(hash(vec2(fi, seed)), hash(vec2(fi + 1.0, seed)));
                            
                            // Posizione base del fulmine (da alto a basso)
                            vec2 base = vec2(
                                0.5 + (offset.x - 0.5) * 0.8,
                                0.0
                            );
                            
                            // Direzione con leggera inclinazione
                            vec2 dir = vec2(
                                (offset.y - 0.5) * 0.3,
                                1.0
                            );
                            
                            // Calcola distanza dalla linea principale
                            vec2 p = uv - base;
                            float proj = dot(p, dir) / dot(dir, dir);
                            
                            if (proj > 0.0 && proj < 1.0) {
                                // Posizione sul segmento
                                vec2 pointOnLine = base + dir * proj;
                                vec2 diff = uv - pointOnLine;
                                
                                // Zigzag usando noise
                                float zigFreq = 8.0 + fi * 2.0;
                                float zig = sin(proj * zigFreq + offset.x * 10.0 + time * 0.5) * 0.06;
                                zig += sin(proj * zigFreq * 1.5 + offset.y * 7.0 + time * 0.3) * 0.03;
                                
                                // Distanza dalla linea a zigzag
                                float dist = abs(diff.x - zig);
                                
                                // Flicker ad alta frequenza
                                float flicker = 0.5 + 0.5 * sin(
                                    time * (30.0 + fi * 5.0) + 
                                    proj * 50.0 + 
                                    offset.x * 100.0
                                );
                                flicker = pow(flicker, 4.0);
                                
                                // Attenuazione lungo la lunghezza
                                float decay = 1.0 - proj;
                                decay = pow(decay, 0.7);
                                
                                // Core del fulmine (sottile e luminoso)
                                float core = smoothstep(0.02, 0.0, dist) * decay * flicker;
                                
                                // Bagliore esterno (più largo e debole)
                                float glow = smoothstep(0.08, 0.0, dist) * decay * 0.3 * flicker;
                                glow += smoothstep(0.15, 0.0, dist) * decay * 0.1 * flicker;
                                
                                // Rami laterali
                                float branchIntensity = 0.0;
                                for (int r = 0; r < 3; r++) {
                                    float ri = float(r);
                                    float branchPos = hash(vec2(fi, ri + 10.0)) * 0.7 + 0.1;
                                    float branchAngle = (hash(vec2(fi, ri + 20.0)) - 0.5) * 1.2;
                                    float branchLen = (0.2 + hash(vec2(fi, ri + 30.0)) * 0.3) * (1.0 - branchPos);
                                    
                                    if (proj > branchPos - 0.02 && proj < branchPos + 0.02) {
                                        vec2 branchDir = vec2(sin(branchAngle), cos(branchAngle) * 0.5);
                                        vec2 branchPoint = pointOnLine + branchDir * branchLen * (proj - branchPos) * 20.0;
                                        float branchDist = length(uv - branchPoint);
                                        branchIntensity += smoothstep(0.04, 0.0, branchDist) * 0.3 * flicker * (1.0 - branchPos) * 0.5;
                                    }
                                }
                                
                                intensity += (core + glow + branchIntensity) * (1.0 - fi * 0.08);
                            }
                        }
                        
                        return intensity;
                    }

                    void main() {
                        vec2 uv = vUv;
                        float time = u_time;
                        
                        // Fulmini con seed diversi per varietà
                        float bolt1 = lightningBolt(uv, 1.0, time);
                        float bolt2 = lightningBolt(uv, 2.0, time + 1.5);
                        float bolt3 = lightningBolt(uv, 3.0, time + 3.2);
                        float bolt4 = lightningBolt(uv, 4.0, time + 4.7);
                        float bolt5 = lightningBolt(uv, 5.0, time + 6.1);
                        float bolt6 = lightningBolt(uv, 6.0, time + 7.8);
                        
                        // Fulmini occasionali (esplosioni)
                        float randomBurst = hash(vec2(floor(time * 2.3), 99.0));
                        float burstTrigger = smoothstep(0.0, 0.1, fract(time * 2.3));
                        float burst = 0.0;
                        if (randomBurst > 0.6) {
                            vec2 burstUV = uv + vec2(hash(vec2(floor(time * 2.3), 55.0)) - 0.5, 0.0) * 0.5;
                            burst = lightningBolt(burstUV, randomBurst * 10.0, time * 1.5) * 1.5 * (1.0 - burstTrigger);
                        }
                        
                        // Flash ambientale
                        float flash = sin(time * 4.7) * 0.5 + 0.5;
                        flash = pow(flash, 12.0) * 0.4;
                        flash += sin(time * 6.1) * 0.5 + 0.5;
                        flash = max(flash, pow(flash, 20.0) * 0.6);
                        
                        // Colori
                        vec3 colCore = vec3(1.0, 1.0, 1.0);
                        vec3 colGlow = vec3(0.4, 0.6, 1.0);
                        vec3 colOuter = vec3(0.1, 0.2, 0.6);
                        
                        float total = bolt1 + bolt2 + bolt3 + bolt4 + bolt5 + bolt6 + burst;
                        
                        vec3 color = colOuter * total * 0.3;
                        color += colGlow * total * 0.5;
                        color += colCore * total * 0.8;
                        color += colCore * flash * 0.5;
                        
                        // Maschera circolare
                        float dist = length(uv - vec2(0.5));
                        float mask = smoothstep(0.5, 0.05, dist);
                        float edgeGlow = smoothstep(0.5, 0.4, dist) * 0.15;
                        
                        color += colGlow * edgeGlow;
                        
                        float alpha = (total * 0.7 + flash * 0.3) * mask;
                        gl_FragColor = vec4(color, alpha);
                    }
                `
            });

            const plane = new THREE.PlaneGeometry(5.5, 7.5, 1, 1);
            const mesh = new THREE.Mesh(plane, boltMat);
            mesh.position.z = -0.1;
            group.add(mesh);

            // Particelle di scintille elettriche
            const sparkCount = 2500;
            const sparkGeo = new THREE.BufferGeometry();
            const sparkPos = new Float32Array(sparkCount * 3);
            const sparkColors = new Float32Array(sparkCount * 3);
            const sparkData = [];

            const cWhite = new THREE.Color(0xffffff);
            const cBlue = new THREE.Color(0x4488ff);
            const cCyan = new THREE.Color(0x00ccff);

            for (let i = 0; i < sparkCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 3.2 + 0.1;
                sparkPos[i*3] = Math.cos(angle) * radius;
                sparkPos[i*3+1] = (Math.random() - 0.5) * 6.5;
                sparkPos[i*3+2] = (Math.random() - 0.5) * 0.6;

                const rand = Math.random();
                const c = rand > 0.5 ? cWhite : (rand > 0.25 ? cBlue : cCyan);
                sparkColors[i*3] = c.r;
                sparkColors[i*3+1] = c.g;
                sparkColors[i*3+2] = c.b;

                sparkData.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: Math.random() * 3.2 + 0.1,
                    vx: (Math.random() - 0.5) * 0.03,
                    vy: (Math.random() - 0.5) * 0.03 + 0.01,
                    life: Math.random(),
                    speed: 0.2 + Math.random() * 0.8
                });
            }

            sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
            sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkColors, 3));

            const sparkMat = new THREE.PointsMaterial({
                size: 0.05,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
            group.add(sparkPoints);

            // Nube di fondo (atmosfera temporalesca)
            const cloudCount = 800;
            const cloudGeo = new THREE.BufferGeometry();
            const cloudPos = new Float32Array(cloudCount * 3);
            const cloudData = [];

            for (let i = 0; i < cloudCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 3.5 + 0.5;
                cloudPos[i*3] = Math.cos(angle) * radius;
                cloudPos[i*3+1] = (Math.random() - 0.5) * 7.0;
                cloudPos[i*3+2] = (Math.random() - 0.5) * 0.5 - 0.3;
                cloudData.push({
                    angle: angle,
                    radius: radius,
                    speed: Math.random() * 0.002 + 0.001
                });
            }

            cloudGeo.setAttribute('position', new THREE.BufferAttribute(cloudPos, 3));
            const cloudMat = new THREE.PointsMaterial({
                size: 0.3,
                color: 0x1a1a2e,
                map: particleTexture,
                transparent: true,
                opacity: 0.3,
                blending: THREE.NormalBlending,
                depthWrite: false
            });
            const cloudPoints = new THREE.Points(cloudGeo, cloudMat);
            group.add(cloudPoints);

            // Update
            group.userData.update = () => {
                const t = uniforms.u_time.value;

                // Sparks
                const sPos = sparkPoints.geometry.attributes.position.array;
                const sCol = sparkPoints.geometry.attributes.color.array;
                const colObj = new THREE.Color();
                for (let i = 0; i < sparkCount; i++) {
                    sparkData[i].life += 0.005 * sparkData[i].speed;
                    if (sparkData[i].life > 1) {
                        sparkData[i].life = 0;
                        sparkData[i].radius = Math.random() * 3.2 + 0.1;
                        sparkData[i].angle = Math.random() * Math.PI * 2;
                        sparkData[i].vx = (Math.random() - 0.5) * 0.03;
                        sparkData[i].vy = (Math.random() - 0.5) * 0.03 + 0.01;
                    }
                    sparkData[i].angle += 0.008;
                    sPos[i*3] = Math.cos(sparkData[i].angle) * sparkData[i].radius + Math.sin(t * 0.5 + i) * 0.02;
                    sPos[i*3+1] += sparkData[i].vy;
                    if (sPos[i*3+1] > 3.8) sPos[i*3+1] = -3.8;
                    if (sPos[i*3+1] < -3.8) sPos[i*3+1] = 3.8;

                    const pulse = Math.sin(sparkData[i].life * Math.PI);
                    colObj.setHSL(0.58, 0.7, 0.3 + pulse * 0.6);
                    sCol[i*3] = colObj.r;
                    sCol[i*3+1] = colObj.g;
                    sCol[i*3+2] = colObj.b;
                }
                sparkPoints.geometry.attributes.position.needsUpdate = true;
                sparkPoints.geometry.attributes.color.needsUpdate = true;

                // Cloud rotation
                const cPos = cloudPoints.geometry.attributes.position.array;
                for (let i = 0; i < cloudCount; i++) {
                    cloudData[i].angle += cloudData[i].speed;
                    cPos[i*3] = Math.cos(cloudData[i].angle) * cloudData[i].radius;
                }
                cloudPoints.geometry.attributes.position.needsUpdate = true;
                cloudPoints.material.opacity = 0.15 + 0.15 * (0.5 + 0.5 * Math.sin(t * 2.3));
            };

            return group;
        }

        function buildWormhole() {
            const group = new THREE.Group();

            const tunnelGeo = new THREE.CylinderGeometry(3.5, 3.5, 80, 32, 120, true);
            const tunnelMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    void main() {
                        float speed = u_time * 18.0;
                        float streak = sin(vUv.x * 80.0) * 0.5 + 0.5;
                        float pulse = sin(vUv.y * 60.0 - speed) * 0.5 + 0.5;
                        
                        vec3 col1 = vec3(0.0, 0.8, 1.0);
                        vec3 col2 = vec3(0.6, 0.0, 1.0);
                        
                        vec3 finalCol = mix(col1, col2, pulse);
                        float alpha = smoothstep(0.0, 0.15, vUv.y) * smoothstep(1.0, 0.85, vUv.y);

                        gl_FragColor = vec4(finalCol, (streak * 0.8 + pulse * 0.4) * alpha);
                    }
                `
            });

            const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnel.rotation.x = Math.PI / 2;
            group.add(tunnel);

            const count = 4000;
            const streakGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const speeds = [];

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 3.3 + 0.1;
                
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = Math.sin(angle) * radius;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 80;

                speeds.push(Math.random() * 1.2 + 0.8);
            }

            streakGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const streakMat = new THREE.PointsMaterial({
                size: 0.12,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.95,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const warpParticles = new THREE.Points(streakGeo, streakMat);
            group.add(warpParticles);

            group.userData.update = () => {
                const posArr = warpParticles.geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    posArr[i * 3 + 2] += speeds[i];

                    if (posArr[i * 3 + 2] > 10) {
                        posArr[i * 3 + 2] = -60;
                    }
                }
                warpParticles.geometry.attributes.position.needsUpdate = true;
            };

            return group;
        }

        function buildQuantumPortal() {
            const group = new THREE.Group();
            const count = 3000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const pData = [];

            for(let i = 0; i < count; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * Math.PI * 2;
                const phi = Math.acos(2 * v - 1);
                const r = 1.8 + Math.sin(theta * 4) * 0.2;

                pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i*3+2] = r * Math.cos(phi) * 0.3;

                pData.push({ theta, phi, r, speed: Math.random() * 0.02 + 0.005 });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
                size: 0.06,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            group.add(points);

            group.userData.update = () => {
                const pArr = points.geometry.attributes.position.array;
                const t = uniforms.u_time.value;
                for(let i = 0; i < count; i++) {
                    pData[i].theta += pData[i].speed;
                    const r = 1.8 + Math.sin(pData[i].theta * 5 + t * 2) * 0.3;
                    
                    pArr[i*3] = r * Math.sin(pData[i].phi) * Math.cos(pData[i].theta);
                    pArr[i*3+1] = r * Math.sin(pData[i].phi) * Math.sin(pData[i].theta);
                }
                points.geometry.attributes.position.needsUpdate = true;
                group.rotation.z += 0.002;
            };

            return group;
        }

        function buildSmokePortal() {
            const group = new THREE.Group();
            const particleCount = 4000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            const cBase = new THREE.Color(0x2a3848);
            const cGlow = new THREE.Color(0x77aaff);

            for(let i = 0; i < particleCount; i++) {
                const x = (Math.random() - 0.5) * 6.0;
                const y = (Math.random() - 0.5) * 7.0 - 1.5;
                const z = (Math.random() - 0.5) * 1.5;

                pos[i*3] = x;
                pos[i*3+1] = y;
                pos[i*3+2] = z;

                const blend = Math.random();
                const c = cBase.clone().lerp(cGlow, blend);
                colors[i*3] = c.r;
                colors[i*3+1] = c.g;
                colors[i*3+2] = c.b;

                pData.push({
                    speedY: Math.random() * 0.018 + 0.008,
                    driftX: (Math.random() - 0.5) * 0.006,
                    driftZ: (Math.random() - 0.5) * 0.004,
                    initialX: x
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.2,
                blending: THREE.NormalBlending,
                depthWrite: false
            });

            const smoke = new THREE.Points(geo, mat);
            group.add(smoke);

            group.userData.update = () => {
                const posArr = smoke.geometry.attributes.position.array;
                const time = uniforms.u_time.value;

                for(let i = 0; i < particleCount; i++) {
                    posArr[i*3+1] += pData[i].speedY;
                    posArr[i*3] += Math.sin(time * 0.8 + posArr[i*3+1]) * 0.003 + pData[i].driftX;
                    posArr[i*3+2] += Math.cos(time * 0.6 + posArr[i*3+1]) * 0.002 + pData[i].driftZ;

                    if(posArr[i*3+1] > 3.8) {
                        posArr[i*3+1] = -5.3;
                        posArr[i*3] = (Math.random() - 0.5) * 6.0;
                        posArr[i*3+2] = (Math.random() - 0.5) * 1.5;
                    }
                }
                smoke.geometry.attributes.position.needsUpdate = true;
            };

            return group;
        }

        function buildWaterPortal() {
            const group = new THREE.Group();

            const waterGeo = new THREE.PlaneGeometry(6, 6, 128, 128);
            const waterMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                side: THREE.DoubleSide,
                vertexShader: `
                    uniform float u_time;
                    varying vec2 vUv;
                    varying float vElevation;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ; m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        
                        float dist = length(vUv - vec2(0.5));
                        float wave = sin(dist * 35.0 - u_time * 4.0) * 0.15;
                        float noise = snoise(vUv * 6.0 + vec2(u_time * 0.3)) * 0.1;
                        
                        pos.z += wave + noise;
                        vElevation = pos.z;

                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;
                    varying float vElevation;

                    void main() {
                        float dist = length(vUv - vec2(0.5));
                        if(dist > 0.48) discard;

                        vec3 deepWater = vec3(0.0, 0.1, 0.3);
                        vec3 shallowWater = vec3(0.0, 0.7, 0.9);
                        vec3 foam = vec3(0.9, 1.0, 1.0);

                        vec3 color = mix(deepWater, shallowWater, vElevation * 2.0 + 0.5);
                        color = mix(color, foam, smoothstep(0.12, 0.22, vElevation));

                        float alpha = smoothstep(0.48, 0.35, dist);
                        gl_FragColor = vec4(color, alpha * 0.85);
                    }
                `
            });

            const waterMesh = new THREE.Mesh(waterGeo, waterMat);
            group.add(waterMesh);

            group.userData.update = () => {
                waterMesh.rotation.z += 0.001;
            };

            return group;
        }

        // --- SWITCHER PORTALI ---
        function switchPortal(type) {
            gsap.to(currentGroup.scale, {
                x: 0, y: 0, z: 0, duration: 0.5, ease: "power2.in", onComplete: () => {
                    scene.remove(currentGroup);
                    
                    if (type === 'nether') currentGroup = buildNetherPortal();
                    else if (type === 'doctor') currentGroup = buildDoctorStrangePortal();
                    else if (type === 'cosmic') currentGroup = buildCosmicVortex();
                    else if (type === 'lightning') currentGroup = buildLightningPortal();
                    else if (type === 'wormhole') currentGroup = buildWormhole();
                    else if (type === 'quantum') currentGroup = buildQuantumPortal();
                    else if (type === 'smoke') currentGroup = buildSmokePortal();
                    else if (type === 'water') currentGroup = buildWaterPortal();

                    currentGroup.position.y = -1.5;
                    currentGroup.scale.set(0, 0, 0);
                    scene.add(currentGroup);

                    gsap.to(currentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.8, ease: "back.out(1.4)" });
                }
            });
        }

        select.addEventListener('change', (e) => switchPortal(e.target.value));

        currentGroup = buildCosmicVortex();
        currentGroup.position.y = -1.5;
        scene.add(currentGroup);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            uniforms.u_time.value += delta;

            if (currentGroup && currentGroup.userData.update) {
                currentGroup.userData.update();
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- SERVICE WORKER REGISTRATION PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=2').then((reg) => {
                    console.log('Service Worker registered:', reg.scope);
                    // Check for updates
                    reg.update();
                }).catch((err) => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }
    </script>
