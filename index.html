<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals</title>
    
    <!-- PWA Configurazione -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="application-name" content="Portals">
    <meta name="apple-mobile-web-app-title" content="Portals">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Librerie Esterne: Three.js per 3D/GLSL e GSAP per fluidità organica -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Bordo nero superiore 10% per fullscreen */
        #fullscreen-top-border {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: #000;
            z-index: 100;
            pointer-events: none;
            transition: height 0.3s ease;
        }

        #fullscreen-top-border.active {
            height: 10vh;
        }

        /* Toast notifications */
        #tap-toast, #swipe-toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 0.5px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        #tap-toast {
            top: 80px;
        }

        #swipe-toast {
            top: 130px;
        }

        #tap-toast.show, #swipe-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* UI Selector Float */
        #ui-controls {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            background: rgba(10, 10, 16, 0.85);
            padding: 8px 14px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #ui-controls.hidden {
            opacity: 0;
            transform: translate(-50%, -30px);
            pointer-events: none;
        }

        select {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        select option {
            background: #0f0f15;
            color: #fff;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="fullscreen-top-border"></div>
    <div id="tap-toast">Tap to enter fullscreen</div>
    <div id="swipe-toast">← Swipe to switch portals →</div>

    <div id="ui-controls">
        <select id="portal-select">
            <option value="nether">Nether</option>
            <option value="doctor">Spark</option>
            <option value="cosmic" selected>Vortex</option>
            <option value="lightning">Storm</option>
            <option value="wormhole">Hyperdrive</option>
            <option value="quantum">Quantum</option>
            <option value="smoke">Mist</option>
            <option value="water">Aqua</option>
            <option value="fire">Inferno</option>
            <option value="alien">Xenon</option>
        </select>
    </div>

    <div id="webgl-container"></div>

    <script>
        // --- SETUP SCENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const select = document.getElementById('portal-select');
        const uiControls = document.getElementById('ui-controls');
        const fullscreenBorder = document.getElementById('fullscreen-top-border');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        let currentGroup = new THREE.Group();
        scene.add(currentGroup);

        let clock = new THREE.Clock();
        let uniforms = { u_time: { value: 0 } };
        let wakeLock = null;

        function createSoftParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createSoftParticleTexture();

        // --- GESTIONE FULLSCREEN IMMERSIVO ---
        async function enableImmersiveFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) return;

            const docEl = document.documentElement;
            try {
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen({ navigationUI: "hide" });
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen();
                }
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                uiControls.classList.add('hidden');
                fullscreenBorder.classList.add('active');
                hideTapToast();
                showSwipeToast();
            } catch (err) {
                console.log("Fullscreen request:", err);
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                uiControls.classList.remove('hidden');
                fullscreenBorder.classList.remove('active');
                showTapToast();
            }
        });

        container.addEventListener('click', enableImmersiveFullscreen);
        uiControls.addEventListener('click', (e) => e.stopPropagation());

        // --- TOAST NOTIFICATIONS ---
        let toastTimeout = null;

        function showTapToast() {
            const toast = document.getElementById('tap-toast');
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function hideTapToast() {
            const toast = document.getElementById('tap-toast');
            toast.classList.remove('show');
        }

        function showSwipeToast() {
            const toast = document.getElementById('swipe-toast');
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Show tap toast on load
        showTapToast();

        // --- SWIPE GESTURE PER SWITCH PORTALI IN FULLSCREEN ---
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        container.addEventListener('touchstart', (e) => {
            if (!document.fullscreenElement) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            isSwiping = true;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isSwiping || !document.fullscreenElement) return;
            e.preventDefault();
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (!isSwiping || !document.fullscreenElement) return;
            isSwiping = false;

            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;
            const absDeltaX = Math.abs(deltaX);
            const absDeltaY = Math.abs(deltaY);

            // Only trigger if horizontal swipe > 50px and more horizontal than vertical
            if (absDeltaX > 50 && absDeltaX > absDeltaY * 1.5) {
                const options = Array.from(select.options);
                const currentIndex = select.selectedIndex;
                let newIndex;

                if (deltaX < 0) {
                    // Swipe left → next portal
                    newIndex = (currentIndex + 1) % options.length;
                } else {
                    // Swipe right → previous portal
                    newIndex = (currentIndex - 1 + options.length) % options.length;
                }

                select.selectedIndex = newIndex;
                switchPortal(options[newIndex].value);
            }
        }, { passive: true });

        // --- GENERATORI DI PORTALI ---

        function buildNetherPortal() {
            const group = new THREE.Group();

            const portalMaterial = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ; m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vec2 st = vUv * 3.5;
                        float n = snoise(st + vec2(0.0, u_time * 0.4));
                        float n2 = snoise(st * 2.0 - vec2(u_time * 0.2, 0.0));
                        float finalNoise = (n + n2) * 0.5;

                        vec3 color1 = vec3(0.2, 0.0, 0.4);
                        vec3 color2 = vec3(0.8, 0.1, 0.9);
                        vec3 finalColor = mix(color1, color2, finalNoise + 0.5);

                        float alpha = smoothstep(0.5, 0.0, length(vUv - vec2(0.5)));
                        gl_FragColor = vec4(finalColor, alpha * 0.85);
                    }
                `
            });

            const planeGeo = new THREE.PlaneGeometry(4.5, 6.5, 32, 32);
            const portalMesh = new THREE.Mesh(planeGeo, portalMaterial);
            group.add(portalMesh);

            const particleCount = 1500;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 4;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 6 - 1.5;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
                velocities.push({ y: Math.random() * 0.02 + 0.005, x: (Math.random() - 0.5) * 0.005 });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const pMat = new THREE.PointsMaterial({
                size: 0.12,
                color: 0xda70d6,
                transparent: true,
                opacity: 0.7,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(geo, pMat);
            group.add(particles);

            group.userData.update = () => {
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3] += velocities[i].x;
                    if (positions[i * 3 + 1] > 3.2) {
                        positions[i * 3 + 1] = -4.8;
                        positions[i * 3] = (Math.random() - 0.5) * 4;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            };

            return group;
        }

        function buildDoctorStrangePortal() {
            const group = new THREE.Group();
            const particleCount = 6000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            const colorSpark1 = new THREE.Color(0xff6600);
            const colorSpark2 = new THREE.Color(0xffcc00);

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 1.8 + (Math.random() - 0.5) * 0.3;
                
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = Math.sin(angle) * radius;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

                const c = Math.random() > 0.5 ? colorSpark1 : colorSpark2;
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                pData.push({
                    angle: angle,
                    radius: radius,
                    speed: Math.random() * 0.04 + 0.02,
                    tangentalSpeed: (Math.random() - 0.5) * 0.05
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const ring = new THREE.Points(geo, mat);
            group.add(ring);

            group.userData.update = () => {
                const posArr = ring.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;
                    pData[i].radius += pData[i].tangentalSpeed * 0.1;

                    if (Math.abs(pData[i].radius - 1.8) > 0.5) {
                        pData[i].radius = 1.8 + (Math.random() - 0.5) * 0.2;
                    }

                    posArr[i * 3] = Math.cos(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 1] = Math.sin(pData[i].angle) * pData[i].radius;
                    posArr[i * 3 + 2] += (Math.random() - 0.5) * 0.02;
                }
                ring.geometry.attributes.position.needsUpdate = true;
                group.rotation.z += 0.002;
            };

            return group;
        }

        function buildCosmicVortex() {
            const group = new THREE.Group();
            const particleCount = 12000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const pData = [];

            for (let i = 0; i < particleCount; i++) {
                const dist = Math.random() * 4.8 + 0.3;
                const angle = Math.random() * Math.PI * 2;
                
                positions[i * 3] = Math.cos(angle) * dist;
                positions[i * 3 + 1] = Math.sin(angle) * dist;
                positions[i * 3 + 2] = (Math.random() - 0.5) * (3.0 - dist * 0.4);

                pData.push({
                    dist: dist,
                    angle: angle,
                    baseHue: (dist * 0.12) % 1.0,
                    speed: 0.012
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.065,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            group.add(points);

            group.userData.update = () => {
                const posArr = points.geometry.attributes.position.array;
                const colArr = points.geometry.attributes.color.array;
                const time = uniforms.u_time.value * 0.1;

                const colorObj = new THREE.Color();

                for (let i = 0; i < particleCount; i++) {
                    pData[i].angle += pData[i].speed;
                    pData[i].dist -= 0.002;

                    if (pData[i].dist <= 0.3) {
                        pData[i].dist = 5.1;
                    }

                    posArr[i * 3] = Math.cos(pData[i].angle) * pData[i].dist;
                    posArr[i * 3 + 1] = Math.sin(pData[i].angle) * pData[i].dist;

                    const currentHue = (0.55 + pData[i].baseHue + Math.sin(time + pData[i].dist * 0.5) * 0.2) % 1.0;
                    colorObj.setHSL(currentHue, 0.85, 0.55);

                    colArr[i * 3] = colorObj.r;
                    colArr[i * 3 + 1] = colorObj.g;
                    colArr[i * 3 + 2] = colorObj.b;
                }
                points.geometry.attributes.position.needsUpdate = true;
                points.geometry.attributes.color.needsUpdate = true;
            };

            return group;
        }

        function buildLightningPortal() {
            const group = new THREE.Group();

            // Shader per portale circolare con archi elettrici sul bordo
            const portalMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                    }

                    void main() {
                        vec2 uv = vUv - 0.5;
                        float dist = length(uv);
                        float angle = atan(uv.y, uv.x);
                        float time = u_time;
                        
                        float mask = smoothstep(0.45, 0.05, dist);
                        
                        float arcs = 0.0;
                        float glow = 0.0;
                        
                        for (int i = 0; i < 5; i++) {
                            float fi = float(i);
                            float seed = hash(vec2(fi, 0.0));
                            float speed = 0.5 + seed * 0.5;
                            
                            float arcPos = fract(angle / 6.28 + time * 0.15 * speed + seed);
                            float arc = smoothstep(0.0, 0.3, arcPos) * (1.0 - smoothstep(0.7, 1.0, arcPos));
                            
                            float flick = 0.5 + 0.5 * sin(time * 25.0 + fi * 10.0 + angle * 5.0);
                            flick = flick * flick * flick;
                            
                            float rimDist = abs(dist - 0.35);
                            float rimGlow = smoothstep(0.05, 0.0, rimDist);
                            
                            arcs += arc * rimGlow * flick * (0.4 + seed * 0.6);
                            glow += smoothstep(0.1, 0.0, rimDist) * 0.15 * (0.5 + 0.5 * sin(time * 3.0 + fi));
                        }
                        
                        float flash = sin(time * 3.7) * 0.5 + 0.5;
                        flash = pow(flash, 12.0) * 0.3;
                        flash += sin(time * 5.1 + 1.0) * 0.5 + 0.5;
                        flash = pow(flash, 20.0) * 0.2;
                        
                        float swirl = sin(dist * 15.0 - time * 2.0 + angle * 3.0) * 0.5 + 0.5;
                        float inner = smoothstep(0.35, 0.0, dist) * swirl * 0.08;
                        
                        vec3 col1 = vec3(0.1, 0.3, 0.8);
                        vec3 col2 = vec3(0.4, 0.7, 1.0);
                        vec3 col3 = vec3(1.0, 1.0, 1.0);
                        
                        vec3 color = col1 * (glow + inner) * 0.8;
                        color += col2 * arcs * 0.6;
                        color += col3 * (arcs * 0.4 + flash);
                        color += col2 * flash * 0.5;
                        
                        float edge = smoothstep(0.48, 0.35, dist) * 0.08;
                        color += col2 * edge;
                        
                        float alpha = (arcs * 0.6 + glow + inner + flash * 0.5) * mask;
                        gl_FragColor = vec4(color, alpha);
                    }
                `
            });

            const plane = new THREE.PlaneGeometry(5, 7, 1, 1);
            const mesh = new THREE.Mesh(plane, portalMat);
            group.add(mesh);

            const sparkCount = 1200;
            const sparkGeo = new THREE.BufferGeometry();
            const sparkPos = new Float32Array(sparkCount * 3);
            const sparkCol = new Float32Array(sparkCount * 3);
            const sparkData = [];
            const colWhite = new THREE.Color(1, 1, 1);
            const colBlue = new THREE.Color(0.3, 0.6, 1);

            for (let i = 0; i < sparkCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 0.2 + Math.random() * 1.8;
                sparkPos[i*3] = Math.cos(angle) * radius;
                sparkPos[i*3+1] = Math.sin(angle) * radius;
                sparkPos[i*3+2] = (Math.random() - 0.5) * 0.2;
                const c = Math.random() > 0.3 ? colBlue : colWhite;
                sparkCol[i*3] = c.r;
                sparkCol[i*3+1] = c.g;
                sparkCol[i*3+2] = c.b;
                sparkData.push({
                    angle, radius,
                    speed: 0.005 + Math.random() * 0.015,
                    drift: (Math.random() - 0.5) * 0.002,
                    life: Math.random()
                });
            }

            sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
            sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));

            const sparkMat = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
            group.add(sparkPoints);

            group.userData.update = () => {
                const t = uniforms.u_time.value;
                const sPos = sparkPoints.geometry.attributes.position.array;
                const sCol = sparkPoints.geometry.attributes.color.array;
                const colObj = new THREE.Color();

                const phi = Math.acos(2 * v - 1);
                const r = 1.8 + Math.sin(theta * 4) * 0.2;

                pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i*3+2] = r * Math.cos(phi) * 0.3;

                pData.push({ theta, phi, r, speed: Math.random() * 0.02 + 0.005 });

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
                size: 0.06,

                blending: THREE.AdditiveBlending,

                group.rotation.z += 0.002;
            };

            return group;

        function buildWaterPortal() {
            const group = new THREE.Group();

            const waterGeo = new THREE.PlaneGeometry(6, 6, 128, 128);
            const waterMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                side: THREE.DoubleSide,
                vertexShader: `
                    uniform float u_time;
                    varying vec2 vUv;
                    varying float vElevation;

                    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                    float snoise(vec2 v) {
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i  = floor(v + dot(v, C.yy) );
                        vec2 x0 = v -   i + dot(i, C.xx);
                        vec2 i1;
                        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxzz;
                        x12.xy -= i1;
                        i = mod289(i);
                        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                        m = m*m ; m = m*m ;
                        vec3 x = 2.0 * fract(p * C.www) - 1.0;
                        vec3 h = abs(x) - 0.5;
                        vec3 ox = floor(x + 0.5);
                        vec3 a0 = x - ox;
                        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                        vec3 g;
                        g.x  = a0.x  * x0.x  + h.x  * x0.y;
                        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                        return 130.0 * dot(m, g);
                    }

                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        
                        float dist = length(vUv - vec2(0.5));
                        float wave = sin(dist * 35.0 - u_time * 4.0) * 0.15;
                        float noise = snoise(vUv * 6.0 + vec2(u_time * 0.3)) * 0.1;
                        
                        pos.z += wave + noise;
                        vElevation = pos.z;

                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;
                    varying float vElevation;

                    void main() {
                        float dist = length(vUv - vec2(0.5));
                        if(dist > 0.48) discard;

                        vec3 deepWater = vec3(0.0, 0.1, 0.3);
                        vec3 shallowWater = vec3(0.0, 0.7, 0.9);
                        vec3 foam = vec3(0.9, 1.0, 1.0);

                        vec3 color = mix(deepWater, shallowWater, vElevation * 2.0 + 0.5);
                        color = mix(color, foam, smoothstep(0.12, 0.22, vElevation));

                        float alpha = smoothstep(0.48, 0.35, dist);
                        gl_FragColor = vec4(color, alpha * 0.85);
                    }
                `
            });

            const waterMesh = new THREE.Mesh(waterGeo, waterMat);
            group.add(waterMesh);

            group.userData.update = () => {
                waterMesh.rotation.z += 0.001;
            };

            return group;
        }

        function buildFirePortal() {
            const group = new THREE.Group();

            // Shader fiamma organica e fluida
            const fireMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    // Hash veloce
                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                    }

                    // Smooth noise 2D
                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(hash(i), hash(i + vec2(1,0)), f.x),
                            mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x),
                            f.y
                        );
                    }

                    // FBM noise per dettaglio organico
                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 3; i++) {
                            v += a * noise(p);
                            p *= 2.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = vUv;
                        float time = u_time;
                        
                        // Maschera circolare
                        vec2 pos = uv - 0.5;
                        float dist = length(pos);
                        float mask = smoothstep(0.45, 0.0, dist);
                        
                        // Coordinate fiamma con distorsione
                        vec2 fUv = (uv - 0.5) * 1.5 + 0.5;
                        
                        // Turbolenza fluida
                        float turb = fbm(vec2(fUv.x * 2.0 + time * 0.3, fUv.y * 2.0 - time * 0.2));
                        float turb2 = fbm(vec2(fUv.x * 4.0 - time * 0.4, fUv.y * 3.0 + time * 0.3));
                        
                        // Forma base della fiamma (cupola)
                        float flameShape = 1.0 - dist * 2.0;
                        flameShape = max(0.0, flameShape);
                        flameShape = pow(flameShape, 1.2);
                        
                        // Lingue di fuoco con FBM
                        float flame1 = fbm(vec2(fUv.x * 5.0 + time * 0.5, fUv.y * 4.0 - time * 0.6));
                        float flame2 = fbm(vec2(fUv.x * 3.0 - time * 0.3, fUv.y * 3.0 - time * 0.4));
                        float flame3 = fbm(vec2(fUv.x * 7.0 + time * 0.2, fUv.y * 5.0 - time * 0.8));
                        
                        // Combina le fiamme
                        float flame = flame1 * 0.5 + flame2 * 0.3 + flame3 * 0.2;
                        flame = flame * flameShape;
                        flame *= 1.0 + (turb - 0.5) * 0.6;
                        flame = pow(flame, 1.8);
                        
                        // Schiarisci il centro
                        float core = smoothstep(0.3, 0.0, dist) * 0.3;
                        core += pow(1.0 - dist * 2.0, 2.0) * 0.2;
                        
                        // Scintillio intermittente
                        float sparkle = pow(max(0.0, sin(time * 5.7 + pos.x * 20.0)), 40.0);
                        sparkle += pow(max(0.0, sin(time * 7.3 + pos.y * 25.0)), 50.0);
                        
                        // Colori fuoco
                        vec3 c1 = vec3(1.0, 0.05, 0.0);
                        vec3 c2 = vec3(1.0, 0.4, 0.0);
                        vec3 c3 = vec3(1.0, 0.8, 0.1);
                        vec3 c4 = vec3(1.0, 1.0, 0.9);
                        
                        // Mix colore basato sull'intensità
                        float t = flame * 0.7 + core * 0.3;
                        vec3 color = c1;
                        color = mix(color, c2, smoothstep(0.0, 0.5, t));
                        color = mix(color, c3, smoothstep(0.3, 0.7, t));
                        color = mix(color, c4, smoothstep(0.6, 1.0, t));
                        
                        // Aggiungi scintillio
                        color += c4 * sparkle * 0.5;
                        
                        // Bordo glow
                        float edge = smoothstep(0.48, 0.35, dist) * 0.08;
                        color += c2 * edge;
                        
                        float alpha = (flame * 0.9 + core * 0.5 + sparkle * 0.3) * mask;
                        gl_FragColor = vec4(color, alpha);
                    }
                `
            });

            const plane = new THREE.PlaneGeometry(5, 7, 1, 1);
            const mesh = new THREE.Mesh(plane, fireMat);
            group.add(mesh);

            // Particelle faville che salgono
            const emberCount = 500;
            const emberGeo = new THREE.BufferGeometry();
            const emberPos = new Float32Array(emberCount * 3);
            const emberCol = new Float32Array(emberCount * 3);
            const emberData = [];
            for (let i = 0; i < emberCount; i++) {
                emberPos[i*3] = (Math.random() - 0.5) * 3.0;
                emberPos[i*3+1] = -2.0 + Math.random() * 5.0;
                emberPos[i*3+2] = (Math.random() - 0.5) * 0.15;
                emberCol[i*3] = 1.0;
                emberCol[i*3+1] = 0.4 + Math.random() * 0.4;
                emberCol[i*3+2] = 0.0;
                emberData.push({
                    speed: 0.008 + Math.random() * 0.02,
                    drift: (Math.random() - 0.5) * 0.008,
                    life: Math.random(),
                    phase: Math.random() * 6.28
                });
            }
            emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
            emberGeo.setAttribute('color', new THREE.BufferAttribute(emberCol, 3));
            const emberMat = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const emberPoints = new THREE.Points(emberGeo, emberMat);
            group.add(emberPoints);

            group.userData.update = () => {
                const t = uniforms.u_time.value;
                const ePos = emberPoints.geometry.attributes.position.array;
                const eCol = emberPoints.geometry.attributes.color.array;
                const colObj = new THREE.Color();
                for (let i = 0; i < emberCount; i++) {
                    emberData[i].life += 0.008;
                    if (emberData[i].life > 1) {
                        emberData[i].life = 0;
                        ePos[i*3] = (Math.random() - 0.5) * 3.0;
                        ePos[i*3+1] = -2.0;
                        emberData[i].speed = 0.008 + Math.random() * 0.02;
                    }
                    ePos[i*3] += Math.sin(t * 0.5 + emberData[i].phase) * 0.003;
                    ePos[i*3+1] += emberData[i].speed;
                    if (ePos[i*3+1] > 3.0) ePos[i*3+1] = -2.0;
                    
                    const pulse = Math.sin(emberData[i].life * Math.PI);
                    colObj.setHSL(0.05, 0.9, 0.2 + pulse * 0.7);
                    eCol[i*3] = colObj.r;
                    eCol[i*3+1] = colObj.g;
                    eCol[i*3+2] = colObj.b;
                }
                emberPoints.geometry.attributes.position.needsUpdate = true;
                emberPoints.geometry.attributes.color.needsUpdate = true;
            };

            return group;
        }

        function buildAlienPortal() {
            const group = new THREE.Group();

            // Shader alieno organico e fluido
            const alienMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    varying vec2 vUv;

                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                    }

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(hash(i), hash(i + vec2(1,0)), f.x),
                            mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x),
                            f.y
                        );
                    }

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 3; i++) {
                            v += a * noise(p);
                            p *= 2.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = vUv;
                        float time = u_time;
                        
                        // Maschera circolare
                        vec2 pos = uv - 0.5;
                        float dist = length(pos);
                        float mask = smoothstep(0.45, 0.0, dist);
                        float angle = atan(pos.y, pos.x);
                        
                        // Coordinate con rotazione lenta
                        float rot = time * 0.05;
                        float ca = cos(rot);
                        float sa = sin(rot);
                        vec2 rUv = vec2(pos.x * ca - pos.y * sa, pos.x * sa + pos.y * ca) * 2.0 + 0.5;
                        
                        // Membrane aliene pulsanti
                        float membrane1 = fbm(vec2(rUv.x * 3.0 + time * 0.2, rUv.y * 3.0 - time * 0.15));
                        float membrane2 = fbm(vec2(rUv.x * 5.0 - time * 0.3, rUv.y * 4.0 + time * 0.2));
                        float membrane3 = fbm(vec2(rUv.x * 2.0 + time * 0.1, rUv.y * 6.0 + time * 0.4));
                        
                        // Pattern alieno
                        float pattern = membrane1 * 0.5 + membrane2 * 0.3 + membrane3 * 0.2;
                        
                        // Pulsazione organica
                        float pulse = 0.5 + 0.5 * sin(time * 0.8 + dist * 3.0);
                        float pulse2 = 0.5 + 0.5 * sin(time * 1.2 + angle * 4.0);
                        
                        // Vene luminose
                        float veins = sin(dist * 20.0 - time * 0.5 + angle * 6.0) * 0.5 + 0.5;
                        veins = pow(veins, 4.0);
                        veins *= smoothstep(0.4, 0.0, dist);
                        
                        // Anelli concentrici pulsanti
                        float rings = sin(dist * 12.0 - time * 0.6) * 0.5 + 0.5;
                        rings = pow(rings, 6.0);
                        
                        // Bolle che fluttuano
                        float bubbles = 0.0;
                        for (int i = 0; i < 4; i++) {
                            float fi = float(i);
                            float bx = 0.5 + 0.3 * cos(time * 0.2 + fi * 1.5);
                            float by = 0.5 + 0.3 * sin(time * 0.3 + fi * 2.0);
                            float bd = length(uv - vec2(bx, by));
                            bubbles += smoothstep(0.08, 0.0, bd) * 0.3;
                        }
                        
                        // Forma base
                        float shape = pow(1.0 - dist * 1.8, 1.5);
                        shape = max(0.0, shape);
                        
                        // Colori alieni (verde/biologico)
                        vec3 col1 = vec3(0.0, 0.6, 0.3);
                        vec3 col2 = vec3(0.0, 0.9, 0.5);
                        vec3 col3 = vec3(0.2, 1.0, 0.7);
                        vec3 col4 = vec3(0.8, 1.0, 0.5);
                        
                        // Mix colore
                        float intensity = pattern * shape + veins * 0.4 + rings * 0.3 + bubbles * 0.5;
                        vec3 color = col1 * 0.3;
                        color = mix(color, col2, smoothstep(0.0, 0.4, intensity));
                        color = mix(color, col3, smoothstep(0.3, 0.7, intensity));
                        color = mix(color, col4, smoothstep(0.6, 1.0, intensity));
                        
                        // Pelle aliena
                        float skin = fbm(vec2(pos.x * 8.0 + time * 0.1, pos.y * 8.0 + time * 0.05));
                        color += col3 * skin * 0.08;
                        
                        // Bordo glow verde
                        float edge = smoothstep(0.48, 0.35, dist) * 0.1;
                        color += col2 * edge;
                        
                        float alpha = (intensity * 0.8 + shape * 0.2 + edge) * mask;
                        gl_FragColor = vec4(color, alpha);
                    }
                `
            });

            const plane = new THREE.PlaneGeometry(5, 7, 1, 1);
            const mesh = new THREE.Mesh(plane, alienMat);
            group.add(mesh);

            // Spore luminose
            const sporeCount = 300;
            const sporeGeo = new THREE.BufferGeometry();
            const sporePos = new Float32Array(sporeCount * 3);
            const sporeCol = new Float32Array(sporeCount * 3);
            const sporeData = [];
            const cGreen1 = new THREE.Color(0.0, 0.8, 0.4);
            const cGreen2 = new THREE.Color(0.2, 1.0, 0.6);
            const cGreen3 = new THREE.Color(0.6, 1.0, 0.3);
            for (let i = 0; i < sporeCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 0.1 + Math.random() * 2.0;
                sporePos[i*3] = Math.cos(angle) * radius;
                sporePos[i*3+1] = Math.sin(angle) * radius;
                sporePos[i*3+2] = (Math.random() - 0.5) * 0.2;
                const rand = Math.random();
                const c = rand > 0.6 ? cGreen3 : (rand > 0.3 ? cGreen2 : cGreen1);
                sporeCol[i*3] = c.r;
                sporeCol[i*3+1] = c.g;
                sporeCol[i*3+2] = c.b;
                sporeData.push({
                    angle, radius,
                    speed: 0.002 + Math.random() * 0.006,
                    drift: (Math.random() - 0.5) * 0.002,
                    life: Math.random(),
                    phase: Math.random() * 6.28
                });
            }
            sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePos, 3));
            sporeGeo.setAttribute('color', new THREE.BufferAttribute(sporeCol, 3));
            const sporeMat = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const sporePoints = new THREE.Points(sporeGeo, sporeMat);
            group.add(sporePoints);

            group.userData.update = () => {
                const t = uniforms.u_time.value;
                const sPos = sporePoints.geometry.attributes.position.array;
                const sCol = sporePoints.geometry.attributes.color.array;
                const colObj = new THREE.Color();
                for (let i = 0; i < sporeCount; i++) {
                    sporeData[i].life += 0.004;
                    if (sporeData[i].life > 1) {
                        sporeData[i].life = 0;
                        sporeData[i].radius = 0.1 + Math.random() * 2.0;
                        sporeData[i].angle = Math.random() * Math.PI * 2;
                    }
                    sporeData[i].angle += sporeData[i].speed + Math.sin(t * 0.3 + sporeData[i].phase) * 0.003;
                    sporeData[i].radius += sporeData[i].drift;
                    if (sporeData[i].radius > 2.2) sporeData[i].radius = 0.1;
                    if (sporeData[i].radius < 0.1) sporeData[i].radius = 2.2;
                    sPos[i*3] = Math.cos(sporeData[i].angle) * sporeData[i].radius;
                    sPos[i*3+1] = Math.sin(sporeData[i].angle) * sporeData[i].radius;
                    
                    const pulse = Math.sin(sporeData[i].life * Math.PI);
                    colObj.setHSL(0.35, 0.8, 0.3 + pulse * 0.5);
                    sCol[i*3] = colObj.r;
                    sCol[i*3+1] = colObj.g;
                    sCol[i*3+2] = colObj.b;
                }
                sporePoints.geometry.attributes.position.needsUpdate = true;
                sporePoints.geometry.attributes.color.needsUpdate = true;
            };

            return group;
        }

        // --- SWITCHER PORTALI ---
        function switchPortal(type) {
            gsap.to(currentGroup.scale, {
                x: 0, y: 0, z: 0, duration: 0.5, ease: "power2.in", onComplete: () => {
                    scene.remove(currentGroup);
                    
                    if (type === 'nether') currentGroup = buildNetherPortal();
                    else if (type === 'doctor') currentGroup = buildDoctorStrangePortal();
                    else if (type === 'cosmic') currentGroup = buildCosmicVortex();
                    else if (type === 'lightning') currentGroup = buildLightningPortal();
                    else if (type === 'wormhole') currentGroup = buildWormhole();
                    else if (type === 'quantum') currentGroup = buildQuantumPortal();
                    else if (type === 'smoke') currentGroup = buildSmokePortal();
                    else if (type === 'water') currentGroup = buildWaterPortal();
                    else if (type === 'fire') currentGroup = buildFirePortal();
                    else if (type === 'alien') currentGroup = buildAlienPortal();

                    currentGroup.position.y = -1.5;
                    currentGroup.scale.set(0, 0, 0);
                    scene.add(currentGroup);

                    gsap.to(currentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.8, ease: "back.out(1.4)" });
                }
            });
        }

        select.addEventListener('change', (e) => switchPortal(e.target.value));

        currentGroup = buildCosmicVortex();
        currentGroup.position.y = -1.5;
        scene.add(currentGroup);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            uniforms.u_time.value += delta;

            if (currentGroup && currentGroup.userData.update) {
                currentGroup.userData.update();
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- SERVICE WORKER REGISTRATION PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=3').then((reg) => {
                    console.log('Service Worker registered:', reg.scope);
                    reg.update();
                }).catch((err) => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
